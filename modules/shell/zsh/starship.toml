# Starship's defaults, with one change: every git_status symbol carries its
# count, separated by spaces. Anything not named here stays default -- starship
# merges this file over its built-in config rather than replacing it.
#
# The symbols carry a trailing space, so the format adds a matching one after
# the opening bracket rather than leaving the closing one hanging off `?1 ]`.
[git_status]
format = '([\[ $all_status$ahead_behind\]]($style) )'
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = '\$${count} '
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
